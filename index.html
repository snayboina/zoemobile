<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- Configurações PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#D32F2F" />
    <meta name="description" content="ZOESTOCK — Sistema PWA Industrial de Gestão de Estoque, EPIs e Inventário" />
    
    <!-- Configurações PWA e Dispositivos Móveis -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ZOESTOCK" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    
    <!-- Tipografia Google Fonts Inter & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">

    <title>ZOESTOCK — Controle de Estoque Industrial</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Registro do Service Worker PWA
      if ('serviceWorker' in navigator) {
        // Limpa caches antigos em desenvolvimento
        if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
          caches.keys().then((names) => {
            names.forEach((name) => caches.delete(name));
          });
        }
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.warn('Falha no registro do ServiceWorker PWA:', err);
          });
        });
      }
    </script>
  </body>
</html>
